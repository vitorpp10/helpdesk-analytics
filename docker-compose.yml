services:
  db:
    image: postgres:17
    container_name: chamados_postgres
    environment:
      - POSTGRES_DB=chamados_db
      - POSTGRES_USER=chamados_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: